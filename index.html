<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-build" content="20261015-daily">
<link rel="icon" href="data:,">
<title>流星雨许愿</title>
<style>
/* ============================================================
   按《流星雨许愿 · 设计规范系统 v1.0》实现
   Token 全部来自规范第 10 节，禁止硬编码魔法数字
   ============================================================ */
:root{
  --sky-void:#000000; --sky-zenith:#02030a; --sky-horizon:#04060f;
  --star-white:#ffffff; --star-warm:#fff6e5; --star-blue:#e8f0ff;
  --meteor-white:#ffffff; --meteor-warm:#fff1d6; --meteor-green:#d8f5e4; --meteor-blue:#dcebff;
  --brand:#3b82f6; --brand-strong:#2563eb;
  --text-1:rgba(255,255,255,.94); --text-2:rgba(255,255,255,.62); --text-3:rgba(255,255,255,.38);
  --glass:rgba(12,16,28,.72); --glass-2:rgba(18,22,36,.86);
  --hair:rgba(255,255,255,.12); --hair-2:rgba(255,255,255,.20);
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-15:15px; --fs-17:17px; --fs-22:22px;
  --lh-tight:1.35; --lh-base:1.6;
  --ff:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-pill:999px; --r-card:14px; --r-panel:18px; --r-round:50%;
  --d1:120ms; --d2:200ms; --d3:350ms; --d4:600ms;
  --e-out:cubic-bezier(.22,1,.36,1); --e-in:cubic-bezier(.4,0,1,1); --e-io:cubic-bezier(.45,0,.55,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--sky-void); color:var(--text-1);
  font-family:var(--ff); font-size:var(--fs-15); line-height:var(--lh-base);
  -webkit-font-smoothing:antialiased;
  touch-action:auto;
}
#sky{touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{z-index:2;pointer-events:none}

/* ============ 顶栏 ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + var(--s3)) var(--s4) var(--s3);
  pointer-events:none;
}
.avatar{
  width:36px;height:36px;border-radius:var(--r-round);
  background:linear-gradient(150deg,#2b3448,#141a26);
  border:1px solid var(--hair-2);
  display:grid;place-items:center;font-size:15px;
  pointer-events:auto;cursor:pointer;
  transition:transform var(--d1) var(--e-out);
}
.avatar:active{transform:scale(.92)}
.more{
  width:36px;height:36px;border-radius:var(--r-round);
  background:var(--glass);border:1px solid var(--hair);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  color:var(--text-2);font-size:17px;letter-spacing:1px;
  display:grid;place-items:center;pointer-events:auto;cursor:pointer;
  transition:transform var(--d1) var(--e-out);
}
.more:active{transform:scale(.92)}

/* ============ 长按蓄力圈 ============ */
.holdring{
  position:fixed;z-index:9;width:58px;height:58px;margin:-29px 0 0 -29px;
  border-radius:50%;pointer-events:none;
  border:1.5px solid rgba(255,255,255,.75);
  box-shadow:inset 0 0 22px rgba(190,220,255,.35),0 0 22px rgba(150,190,255,.28);
  animation:holdPulse .55s ease-in-out infinite alternate;
}
@keyframes holdPulse{
  from{transform:scale(.66);opacity:.95}
  to{transform:scale(1.08);opacity:.5}
}
/* ============ 星愿徽章 ============ */
.energy{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:var(--s3);padding:4px 11px;
  border:1px solid rgba(190,220,255,.30);border-radius:var(--r-pill);
  background:rgba(20,28,46,.55);backdrop-filter:blur(10px);
  font-size:var(--fs-12);color:#dbe7ff;letter-spacing:.06em;
  transition:opacity var(--d2) var(--e-out),transform var(--d2) var(--e-spring);
}
.energy b{color:#fff;font-weight:600}
.energy.bump{animation:energyBump .5s var(--e-spring)}
@keyframes energyBump{
  0%{transform:scale(1)}
  40%{transform:scale(1.22)}
  100%{transform:scale(1)}
}
.energy.full{border-color:rgba(255,235,170,.6);color:#ffe9a8;box-shadow:0 0 18px rgba(255,215,120,.25)}
/* 能量只用进度条表示，不出现数字 —— 免得被误读成「许了几个愿望」 */
.ebar{display:inline-block;width:54px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.ebar .efill{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,#bcd6ff,#fff);transition:width .5s var(--e-out)}
.energy.full .ebar .efill{background:linear-gradient(90deg,#ffd88a,#fff3cf)}
.efull{font-style:normal;font-size:var(--fs-11);color:#ffe9a8;letter-spacing:.08em}

/* ============ 标题 ============ */
.title{
  position:fixed;z-index:5;left:0;right:0;
  top:calc(env(safe-area-inset-top,0px) + 72px);
  text-align:center;pointer-events:none;
}
.title h1{font-size:var(--fs-22);font-weight:600;letter-spacing:.06em}
.title p{font-size:var(--fs-12);color:var(--text-3);margin-top:var(--s1);letter-spacing:.2em}

/* ============ 底部输入 ============ */
.composer{
  position:fixed;z-index:10;
  left:50%;transform:translateX(-50%);
  width:min(76vw,330px);
  bottom:calc(env(safe-area-inset-bottom,0px) + var(--s5) + var(--keyboard-lift,0px));
  display:flex;align-items:center;gap:var(--s2);
  height:52px;padding:0 4px 0 16px;
  touch-action:manipulation;
  background:rgba(10,13,22,.78);
  border:1px solid var(--hair);
  border-radius:var(--r-pill);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transition:border-color var(--d2) var(--e-out);
}
.composer:focus-within{border-color:var(--hair-2)}
/* 正在输入：点亮边框 */
.composer.typing{border-color:rgba(190,220,255,.34)}
/* 输入达到 2 字：发送按钮进入"就绪"发光态 */
.send.ready{box-shadow:0 0 0 3px rgba(255,255,255,.10),0 0 16px rgba(190,220,255,.5)}
/* 许愿进行中：边框点亮 + 轻微浮起 */
.composer.sent{
  border-color:rgba(190,220,255,.55);
  box-shadow:0 0 0 1px rgba(190,220,255,.18),0 0 28px rgba(150,190,255,.22),0 10px 40px rgba(0,0,0,.45);
  animation:composerPop .5s var(--e-spring);
}
@keyframes composerPop{
  0%{transform:translateX(-50%) translateY(0) scale(1)}
  35%{transform:translateX(-50%) translateY(-4px) scale(1.025)}
  100%{transform:translateX(-50%) translateY(0) scale(1)}
}
/* 按钮：点击脉冲 + 光圈扩散 */
.send.pulse{animation:sendPulse .55s var(--e-out)}
@keyframes sendPulse{
  0%{transform:scale(1)}
  25%{transform:scale(1.28)}
  55%{transform:scale(.92)}
  100%{transform:scale(1)}
}
.send-ring{
  position:absolute;left:50%;top:50%;width:36px;height:36px;
  margin:-18px 0 0 -18px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.9);
  pointer-events:none;
  animation:sendRing .7s var(--e-out) forwards;
}
@keyframes sendRing{
  0%{transform:scale(.6);opacity:.9}
  100%{transform:scale(3.6);opacity:0}
}
.composer input{
  flex:1;min-width:0;height:100%;
  background:none;border:none;outline:none;
  color:var(--text-1);font-family:var(--ff);font-size:16px;
}
.composer input::placeholder{color:var(--text-3)}

/* ============ 许愿类别选择 ============ */
.cats{
  position:fixed;z-index:10;
  left:50%;transform:translateX(-50%);
  width:min(86vw,360px);
  bottom:calc(env(safe-area-inset-bottom,0px) + var(--s5) + var(--keyboard-lift,0px) + 62px);
  display:flex;justify-content:center;gap:6px;
  opacity:0;pointer-events:none;
  transition:opacity var(--d2) var(--e-out),transform var(--d2) var(--e-out);
  transform:translateX(-50%) translateY(6px);
}
.cats.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.cat{
  flex:1 1 0;min-width:0;
  display:flex;align-items:center;justify-content:center;gap:4px;
  height:30px;padding:0 6px;
  font-family:var(--ff);font-size:12px;
  color:var(--text-2);
  background:rgba(10,13,22,.72);
  border:1px solid var(--hair);
  border-radius:var(--r-pill);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
  transition:color var(--d1) var(--e-out),border-color var(--d1) var(--e-out),background var(--d1) var(--e-out),transform var(--d1) var(--e-spring);
}
.cat .cs,.cat .cn{pointer-events:none}
.cat .cs{font-size:12px;line-height:1;color:var(--c,#9ab)}
.cat:hover,.cat:active{transform:translateY(-1px)}
/* 选中：整颗 chip 染上类别色，一眼看出「我正在为这一类的愿望许愿」 */
.cat.on{
  color:#fff;
  border-color:rgba(var(--cg,160,190,255),.62);
  background:rgba(var(--cg,160,190,255),.16);
  box-shadow:0 0 14px rgba(var(--cg,160,190,255),.32);
}
.cat.on .cs{color:var(--c,#fff)}
@media (max-height:660px){
  .cats{bottom:calc(env(safe-area-inset-bottom,0px) + var(--s5) + var(--keyboard-lift,0px) + 58px);gap:4px}
  .cat{height:27px;font-size:11px;gap:3px}
}
/* 矮屏下类别条会顶到输入框上沿，抬高一点避免贴太近 */
@media (max-height:600px){
  .cats{bottom:calc(env(safe-area-inset-bottom,0px) + var(--s5) + var(--keyboard-lift,0px) + 56px)}
  .cat{padding:0 4px;font-size:11px}
  .cat .cn{display:none}      /* 极矮屏只留符号，省出宽度 */
  .cat .cs{font-size:13px}
}
.send{
  width:44px;height:44px;flex:none;border-radius:var(--r-round);
  touch-action:manipulation;
  background:#fff;color:#000;border:none;cursor:pointer;
  display:grid;place-items:center;font-size:17px;font-weight:600;
  transition:transform var(--d1) var(--e-out),opacity var(--d2) var(--e-out);
}
.send:active{transform:scale(.90)}
.send[disabled]{opacity:.35}

/* ============ 星图文案（送给观众） ============ */
/* 诗句是这一幕的主角：整块落在屏幕中央、字号放大，配一圈星光 */
.poem{
  position:fixed;left:50%;top:50%;z-index:15;
  transform:translate(-50%,-50%);
  pointer-events:none;text-align:center;
  width:min(88vw,520px);
  padding:44px 30px 46px;
  font-size:23px;line-height:2;letter-spacing:.16em;font-weight:500;
  color:#fff;
  text-shadow:0 0 22px rgba(198,224,255,.85),0 0 52px rgba(150,195,255,.5),0 2px 10px rgba(0,0,0,.85);
  white-space:pre-line;
  opacity:0;
}
/* 柔光底：把诗句从星空里托起来，同时仍然看得见背后那幅心 */
.poem::before{
  content:'';position:absolute;inset:-16% -12%;z-index:-1;border-radius:50%;
  background:radial-gradient(ellipse at center,
    rgba(6,10,22,.9),rgba(6,10,22,.66) 46%,rgba(6,10,22,.24) 70%,rgba(6,10,22,0) 86%);
  opacity:0;transform:scale(.72);
  transition:opacity 1s var(--e-out),transform 1.5s cubic-bezier(.22,1,.36,1);
}
/* 一圈星光描边：像被星星围住 */
.poem::after{
  content:'';position:absolute;inset:4% 8%;z-index:-1;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(160,200,255,.18),rgba(160,200,255,.06) 55%,rgba(160,200,255,0) 78%);
  box-shadow:0 0 60px 14px rgba(150,195,255,.15),inset 0 0 44px rgba(180,215,255,.12);
  opacity:0;transform:scale(.86);
  transition:opacity 1.2s var(--e-out) .1s,transform 1.8s cubic-bezier(.22,1,.36,1) .1s;
}
.poem.show{opacity:1}
.poem.show::before{opacity:1;transform:scale(1)}
.poem.show::after{opacity:1;transform:scale(1)}

/* 整体入场：整句一起从观众这一侧缓缓推近，由虚变实 —— 一句话被轻轻送到眼前 */
.poem .pl{
  display:block;
  opacity:0;
  transform:translateY(28px) scale(.97);
  filter:blur(10px);
  transition:opacity 1.05s var(--e-out),transform 1.4s cubic-bezier(.22,1,.36,1),filter 1.05s var(--e-out);
  transition-delay:var(--d,0s);
}
.poem.show .pl{opacity:1;transform:none;filter:blur(0)}

/* 逐字：每个字再各点亮一次，像星光一颗颗落在纸上 */
.poem .pc{
  display:inline-block;
  opacity:0;
  transform:translateY(11px) scale(.9);
  transition:opacity .8s var(--e-out),transform 1s cubic-bezier(.2,1.4,.36,1),text-shadow 1.3s var(--e-out);
  transition-delay:var(--td,0s);
}
.poem.show .pc{
  opacity:1;transform:none;
  text-shadow:0 0 34px rgba(255,255,255,1),0 0 78px rgba(190,220,255,.85),0 2px 10px rgba(0,0,0,.85);
}

/* 动画收尾后撤掉滤镜与过渡层，长驻期间不额外吃 GPU */
.poem.done .pl,
.poem.done .pc{transition:none;filter:none;transform:none;opacity:1}

/* 诗句占据画面中央时，愿望文字与星图连线都退到后面去 */
.wl-dim{opacity:.12;filter:blur(4px)}
.web-dim{opacity:.3}

/* ============ 今日流星 · 寄语条 ============ */
/* 放在输入框上方的空白带 → 不压标题、不压副标题、不压星图 */
.daily{
  position:fixed;z-index:16;
  left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + var(--s5) + var(--keyboard-lift,0px) + 64px);
  width:min(88vw,340px);
  display:flex;align-items:center;gap:10px;
  padding:11px 12px 11px 14px;
  background:rgba(10,13,22,.82);
  border:1px solid rgba(190,220,255,.26);
  border-radius:16px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 0 0 1px rgba(190,220,255,.10),0 10px 36px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;
  transition:opacity .6s var(--e-out),transform .6s cubic-bezier(.22,1,.36,1);
}
.daily.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.daily .dw{
  flex:0 0 auto;
  font-size:10px;letter-spacing:.14em;
  color:#ffe9ad;
  padding:3px 8px;border-radius:999px;
  border:1px solid rgba(255,225,150,.36);
  background:rgba(255,225,150,.10);
  white-space:nowrap;
}
.daily .dt{flex:1;min-width:0;font-size:13px;line-height:1.5;color:var(--text-1)}
.daily .dx{
  flex:0 0 auto;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text-3);
  background:none;border:none;padding:0;
  -webkit-tap-highlight-color:transparent;
}
@media (max-height:660px){
  .daily{bottom:calc(env(safe-area-inset-bottom,0px) + var(--s5) + var(--keyboard-lift,0px) + 58px);padding:9px 10px 9px 12px}
  .daily .dt{font-size:12px}
}

/* 矮屏（如 iPhone SE）：诗句收紧 */
@media (max-height:660px){
  .poem{font-size:19px;line-height:1.9;letter-spacing:.12em;padding:34px 22px 36px}
}

/* ============ Toast ============ */
.toast{
  position:fixed;z-index:20;left:50%;
  top:calc(env(safe-area-inset-top,0px) + var(--s5));
  transform:translateX(-50%) translateY(-14px);
  display:flex;align-items:center;gap:var(--s2);
  max-width:min(88vw,420px);
  padding:10px 18px;
  background:var(--glass-2);
  border:1px solid var(--hair);
  border-radius:var(--r-pill);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  font-size:var(--fs-13);color:var(--text-1);white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity var(--d3) var(--e-out),transform var(--d3) var(--e-out);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ic{color:#fcd34d}
.toast .ago{color:var(--text-3);font-size:var(--fs-11);margin-left:var(--s1)}

/* ============ 愿望抽屉 ============ */
.mask{
  position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity var(--d3) var(--e-out);
}
.mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;z-index:15;left:0;right:0;
  bottom:0;
  max-height:64vh;
  background:var(--glass-2);
  border-top:1px solid var(--hair);
  border-radius:var(--r-panel) var(--r-panel) 0 0;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  transform:translateY(102%);
  transition:transform var(--d3) var(--e-out);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.show{transform:translateY(0)}
.drawer-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--s4) var(--s5) var(--s3);
}
.drawer-h .t{font-size:var(--fs-15);font-weight:600}
.drawer-h .n{font-size:var(--fs-11);color:var(--text-3);margin-left:var(--s2)}
.drawer-h .x{width:30px;height:30px;border-radius:var(--r-round);background:rgba(255,255,255,.07);border:none;color:var(--text-2);font-size:15px;cursor:pointer}
.list{flex:1;overflow:auto;padding:0 var(--s5) var(--s5);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.wish-hint{
  margin:0 0 var(--s3);padding:8px 10px;border-radius:10px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  font-size:var(--fs-11);color:var(--text-3);line-height:1.65;
}
.wish{
  display:flex;align-items:flex-start;gap:var(--s3);
  padding:var(--s3) 0;border-bottom:1px solid rgba(255,255,255,.06);
}
.wish .st{color:#fcd34d;font-size:var(--fs-13);line-height:1.5;flex:none}
.wish .bd{flex:1;min-width:0}
.wish .bd .txt{font-size:var(--fs-13);color:var(--text-1);word-break:break-all}
.wish .bd .mt{font-size:var(--fs-11);color:var(--text-3);margin-top:2px}
.empty{text-align:center;color:var(--text-3);font-size:var(--fs-13);padding:var(--s10) 0}

/* ============ 更多面板 ============ */
.sheet{
  position:fixed;z-index:15;left:var(--s4);right:var(--s4);
  bottom:calc(env(safe-area-inset-bottom,0px) + var(--s5));
  background:var(--glass-2);
  border:1px solid var(--hair);
  border-radius:var(--r-panel);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:var(--s2);
  opacity:0;pointer-events:none;transform:translateY(12px) scale(.98);
  transition:opacity var(--d2) var(--e-out),transform var(--d2) var(--e-out);
}
.sheet.show{opacity:1;pointer-events:auto;transform:none}
.sheet button{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  background:none;border:none;color:var(--text-1);
  font-family:var(--ff);font-size:var(--fs-13);
  padding:var(--s3) var(--s4);border-radius:var(--r-card);cursor:pointer;
  text-align:left;
}
.sheet button:active{background:rgba(255,255,255,.06)}
.sheet button .v{color:var(--text-3);font-size:var(--fs-12)}
.sheet hr{border:none;border-top:1px solid rgba(255,255,255,.07);margin:var(--s1) var(--s4)}

/* ============ 保存星图 · 预览页 ============ */
.savemask{
  position:fixed;inset:0;z-index:30;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity var(--d3) var(--e-out);
}
.savemask.show{opacity:1;pointer-events:auto}
.saveview-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + var(--s4)) var(--s5) var(--s3);
  flex:none;
}
.saveview-h .t{font-size:var(--fs-15);font-weight:600;letter-spacing:.02em}
.saveview-h .fmt{
  font-size:var(--fs-11);color:var(--text-2);letter-spacing:.1em;
  border:1px solid var(--hair);border-radius:var(--r-pill);
  padding:3px 10px;background:rgba(255,255,255,.05);
}
.saveview-b{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:var(--s2) var(--s4);
  touch-action:pan-y;
}
.saveview-b img{
  max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;
  -webkit-touch-callout:default;touch-action:pan-y;
  border-radius:var(--r-card);
  border:1px solid var(--hair);
  box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
  transform:scale(.96);opacity:0;
  transition:transform var(--d3) var(--e-spring),opacity var(--d3) var(--e-out);
  user-select:auto;-webkit-user-select:auto;
}
.save-help{flex:none;padding:6px 20px 0;text-align:center;font-size:12px;line-height:1.7;color:var(--text-2)}
.savemask.image-only .saveview-h,.savemask.image-only .saveview-f{display:none}
.savemask.image-only .saveview-b{padding:24px}
.savemask.image-only .saveview-b img{border-radius:0;border:0;box-shadow:none}
.saveview-f{flex-wrap:wrap}
.saveview-f .save-help{flex-basis:100%;padding:0 0 8px}
.savemask.show .saveview-b img{transform:none;opacity:1}
.saveview-f{
  display:flex;gap:var(--s3);flex:none;
  padding:var(--s4) var(--s5) calc(env(safe-area-inset-bottom,0px) + var(--s5));
}
.saveview-f button{
  flex:1;height:46px;border-radius:var(--r-pill);
  font-family:var(--ff);font-size:var(--fs-15);font-weight:600;cursor:pointer;
  border:1px solid var(--hair-2);background:rgba(255,255,255,.06);color:var(--text-1);
  transition:transform var(--d1) var(--e-out),opacity var(--d2) var(--e-out);
}
.saveview-f button:active{transform:scale(.97)}
.saveview-f .primary{
  background:#fff;color:#000;border-color:#fff;
  box-shadow:0 0 24px rgba(190,220,255,.35);
}

/* ============ 微信内置浏览器 · 保存指引 ============ */
.wxmask{
  position:fixed;inset:0;z-index:40;
  background:rgba(0,0,0,.72);
  display:grid;place-items:center;padding:var(--s5);
  opacity:0;pointer-events:none;transition:opacity var(--d2) var(--e-out);
}
.wxmask.show{opacity:1;pointer-events:auto}
.wxcard{
  width:min(86vw,320px);
  background:var(--glass-2);
  border:1px solid var(--hair);
  border-radius:var(--r-panel);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:var(--s6) var(--s5) var(--s5);
  text-align:center;
  transform:scale(.94);
  transition:transform var(--d3) var(--e-spring);
}
.wxmask.show .wxcard{transform:none}
.wxcard .ic{font-size:34px;line-height:1}
.wxcard .t{font-size:var(--fs-15);font-weight:600;margin-top:var(--s3)}
.wxcard .s{font-size:var(--fs-12);color:var(--text-2);line-height:2;margin-top:var(--s2)}
.wxcard .s b{color:var(--text-1);font-weight:600}
.wxcard button{
  width:100%;height:42px;border-radius:var(--r-pill);
  font-family:var(--ff);font-size:var(--fs-13);font-weight:600;cursor:pointer;
  margin-top:var(--s3);border:1px solid var(--hair-2);
  background:rgba(255,255,255,.06);color:var(--text-1);
  transition:transform var(--d1) var(--e-out);
}
.wxcard button:active{transform:scale(.97)}
.wxcard button.primary{background:#fff;color:#000;border-color:#fff}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

<script>
/* ============================================================
   规范实现层 —— 严格对应《设计规范系统》第 06 / 07 / 08 节
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand  = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const rgbaOf = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
};

const sky = document.getElementById('sky');
const fxc = document.getElementById('fx');
const sctx = sky.getContext('2d');
const fctx = fxc.getContext('2d', { alpha: true });

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [sky, fxc]) { c.width = W * DPR; c.height = H * DPR; }
  // 规范：两个画布都必须设置 DPR 变换，否则绘制被压缩到左上 1/4 且清除不干净
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
  layoutWishNodes();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ---------- 规范 2.1 / 6.2：三层夜空 + 星等分布星点 ---------- */
const STAR_COLORS = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff',
                     '#ffffff', '#ffffff', '#ffffff', '#fff6e5', '#e8f0ff'];
let stars = [];
const DENSITY = 1.0;

function screenScale() { return Math.max(0.62, Math.min(1.35, Math.min(W, H) / 760)); }

function buildStars() {
  const base = Math.round((W * H) / (1600 * 1200) * 900 * DENSITY);
  stars = [];
  for (let i = 0; i < base; i++) {
    // 规范 6.1：幂律采样星等 —— 暗星远多于亮星
    const mag = Math.pow(Math.random(), 2.6);
    stars.push({
      x: rand(0, W), y: rand(0, H),
      r: 0.30 + (1 - mag) * 0.95,
      a: 0.22 + (1 - mag) * 0.66,
      glow: mag < 0.045,                 // 仅 4.5% 亮星带光晕
      p: rand(0.75, 1.0),                // 视差深度
      ts: rand(0.5, 2.2), ph: rand(0, TAU),
      twinkle: Math.random() < 0.09,      // 少数星有可见的明暗起伏（夜空更"活"）
      c: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
    });
  }
}

function drawSky(now) {
  const g = sctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#000000');
  g.addColorStop(0.55, '#02030a');
  g.addColorStop(1, '#04060f');
  sctx.fillStyle = g;
  sctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const sx = s.x - cam.x * s.p, sy = s.y - cam.y * s.p;
    if (sx < -3 || sx > W + 3 || sy < -3 || sy > H + 3) continue;
    // 多数星几乎不闪（真实星光）；少数星可见起伏 → 夜空有生气
    const tw = s.twinkle
      ? 0.68 + 0.32 * Math.sin(now * s.ts + s.ph)
      : 0.88 + 0.12 * Math.sin(now * s.ts + s.ph);
    // 规范 7：大气消光 —— 靠近地平线变暗（星空同样适用）
    const ext = Math.pow(1 - (sy / H) * 0.6, 1.35);
    sctx.globalAlpha = s.a * tw * ext;
    sctx.fillStyle = s.c;
    sctx.beginPath(); sctx.arc(sx, sy, s.r, 0, TAU); sctx.fill();
    if (s.glow) {
      sctx.globalAlpha = s.a * tw * ext * 0.08;
      sctx.beginPath(); sctx.arc(sx, sy, s.r * 2.6, 0, TAU); sctx.fill();
    }
  }
  sctx.globalAlpha = 1;
}

/* ---------- 超新星：夜空中偶发的亮星爆发（气氛活力） ---------- */
let novas = [];
let novaTimer = rand(8, 18);
function updateNovas(dt) {
  novaTimer -= dt;
  if (novaTimer <= 0) {
    novaTimer = rand(14, 32);
    novas.push({
      x: rand(W * 0.06, W * 0.94), y: rand(H * 0.05, H * 0.72),
      t: 0, dur: rand(2.0, 3.2), cross: rand(6, 13),
    });
  }
  for (let i = novas.length - 1; i >= 0; i--) {
    novas[i].t += dt;
    if (novas[i].t >= novas[i].dur) novas.splice(i, 1);
  }
}
function drawNovas() {
  if (!novas.length) return;
  sctx.save();
  sctx.globalCompositeOperation = 'lighter';
  for (const n of novas) {
    const k = n.t / n.dur;
    const a = k < 0.10 ? k / 0.10 : Math.pow(1 - (k - 0.10) / 0.90, 1.5);   // 快起慢落
    const cx = n.x - cam.x * 0.9, cy = n.y - cam.y * 0.9;
    const L = n.cross * (1 + (1 - a) * 0.5);
    const g = sctx.createRadialGradient(cx, cy, 0, cx, cy, L);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.85 * a).toFixed(3) + ')');
    g.addColorStop(0.25, 'rgba(220,235,255,' + (0.32 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(220,235,255,0)');
    sctx.fillStyle = g;
    sctx.beginPath();
    sctx.arc(cx, cy, L, 0, TAU);
    sctx.fill();
    // 十字星芒
    sctx.globalAlpha = a * 0.75;
    sctx.strokeStyle = '#ffffff';
    sctx.lineWidth = 0.6;
    sctx.beginPath();
    sctx.moveTo(cx - L * 1.5, cy); sctx.lineTo(cx + L * 1.5, cy);
    sctx.moveTo(cx, cy - L * 1.5); sctx.lineTo(cx, cy + L * 1.5);
    sctx.stroke();
    sctx.globalAlpha = 1;
  }
  sctx.restore();
}

/* ---------- 相机（拖动环顾 + 自动缓漂） ---------- */
const world = { w: 2600, h: 2600 };
const cam = {
  x: (world.w - W) / 2, y: (world.h - H) / 2,
  vx: 0, vy: 0, tx: 0, ty: 0,
};
let dragging = false, dragMoved = false, lastPX = 0, lastPY = 0, dragId = null;
let autoDrift = 0;

function pointerDown(e) {
  const t = e.touches ? e.touches[0] : e;
  if (e.touches && e.touches.length > 1) return;
  dragging = true; dragMoved = false; dragId = t.identifier ?? 0;
  lastPX = t.clientX; lastPY = t.clientY;
  pressX = t.clientX; pressY = t.clientY; pressT = performance.now();
  cam.vx = cam.vy = 0;
  // 长按蓄力：静止按住 240ms 出现蓄力圈
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => {
    if (dragging && !dragMoved) showHold(pressX, pressY);
  }, 240);
}
function pointerMove(e) {
  if (!dragging) return;
  const t = e.touches ? Array.from(e.touches).find(x => x.identifier === dragId) : e;
  if (!t) return;
  const dx = t.clientX - lastPX, dy = t.clientY - lastPY;
  if (Math.abs(dx) + Math.abs(dy) > 2) { dragMoved = true; hideHold(); }
  cam.x -= dx; cam.y -= dy;
  cam.vx = -dx * 6; cam.vy = -dy * 6;
  lastPX = t.clientX; lastPY = t.clientY;
  clampCam();
}
let holdTimer = null, holdEl = null;
function showHold(x, y) {
  if (holdEl) return;
  holdEl = document.createElement('div');
  holdEl.className = 'holdring';
  holdEl.style.left = x + 'px';
  holdEl.style.top = y + 'px';
  document.body.appendChild(holdEl);
}
function hideHold() {
  clearTimeout(holdTimer);
  if (holdEl) { holdEl.remove(); holdEl = null; }
}
let pressX = 0, pressY = 0, pressT = 0;
function pointerUp() {
  dragging = false;
  // 长按（未拖动、按住 >380ms）→ 在指尖召唤一小股流星
  if (!dragMoved && performance.now() - pressT > 380) {
    summonBurst(pressX, pressY);
  }
  hideHold();
  if (dragMoved) suppressClick = 2;
}
function clampCam() {
  const mx = world.w - W, my = world.h - H;
  cam.x = clamp(cam.x, 0, mx);
  cam.y = clamp(cam.y, 0, my);
  cam.tx = clamp(cam.tx, 0, mx);
  cam.ty = clamp(cam.ty, 0, my);
}
let suppressClick = 0;

sky.addEventListener('mousedown', pointerDown);
window.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);
sky.addEventListener('touchstart', pointerDown, { passive: true });
window.addEventListener('touchmove', pointerMove, { passive: true });
window.addEventListener('touchend', pointerUp);

/* 流星配色：参照真实流星光谱（钠黄 / 镁青 / 钙紫 / 氧蓝 / 铁金），
   但把色相拉开、饱和度提上来 —— 让每颗流星都有一眼可辨的颜色，
   而不是一片「白线」。core 是核心色（偏白），tint 是尾迹色（带色相）。 */
const METEOR_TINTS = [
  { core: '#ffffff', tint: '#b9d4ff', w: 0.20 },   // 冰蓝（氧，多数）—— 经典冷白偏蓝
  { core: '#fff8ec', tint: '#ffd274', w: 0.19 },   // 暖金（钠）
  { core: '#e8fff6', tint: '#6aecbc', w: 0.17 },   // 青绿（镁）
  { core: '#fff2e8', tint: '#ff9450', w: 0.15 },   // 橙红（低空钠）
  { core: '#f2e8ff', tint: '#b189ff', w: 0.13 },   // 紫罗兰（钙）
  { core: '#ffffff', tint: '#7cc4ff', w: 0.12 },   // 亮天蓝（氧，亮流星）
  { core: '#fffdf5', tint: '#3ce4ff', w: 0.04 },   // 电光青（稀有，极亮）
];
function pickTint() {
  let r = Math.random();
  for (const t of METEOR_TINTS) { r -= t.w; if (r <= 0) return t; }
  return METEOR_TINTS[0];
}

const LS_TODAY = 'meteor_wish_today_v1';

// 以「本地日期」为种子，保证同一天结果一致（不用 Date.now 的毫秒）

}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
function dailySeed() { return hashStr('sky-' + dayIndex()); }
let dailyMeteor = null;          // 正在飞的那颗今日流星（用于绘制专属光晕）

function todaySeen() {

// 发射今日流星：从固定方向（右上→左下）穿过屏幕，比普通流星更粗更亮
function launchDailyMeteor(withWord) {
  const sc = screenScale();
  const tint = dailyTint();
  const seed = dailySeed();
  // 起点定在屏幕右上偏下的位置 → 从标题区下方掠过，不压标题与能量徽章
  const ax = W * (0.78 + (seed % 17) / 100);
  const ay = H * (0.30 + ((seed >>> 4) % 14) / 100);
  const ang = Math.PI - 0.62;                       // 朝左下，与常见流星同向
  // 今日流星要「看得清」：速度比环境流星慢一档，尾迹更长，横穿屏幕约 2.4 秒
  const sp = 430 * sc;
  const dirx = Math.cos(ang), diry = Math.sin(ang);
  // 轨迹会一路往左下 → 按屏高限制飞行距离，避免长尾扫到输入框
  const m = {
    ox: ax, oy: ay, x: ax, y: ay, vx: dirx * sp, vy: diry * sp, dirx, diry,
    sp, len: 300 * sc, w: 2.2, fireball: true, ang,
    color: { core: tint.core, tint: tint.tint },
    bright: 1.85, t: 0, life: 3.2, alpha: 0,

}

/* ---------- 长按召唤：指尖倾泻一小股流星 ---------- */
function summonBurst(x, y) {
  summon = { x, y, t: 0, spawned: 0, count: irand(13, 19), gap: rand(0.035, 0.06) };
  glows.push({ x, y, t: 0, dur: 0.7, r: 130 });
  rings.push({ x, y, t: 0, dur: 0.8, max: 90, w: 1.6, a: 0.55 });
  flashes.push({ a: 0.07, t: 0, dur: 0.3 });
  SFX.whoosh();
  if (navigator.vibrate) { try { navigator.vibrate(14); } catch (e) {} }
  toast('✦ 流星被你召唤而来');
}

function spawnMeteor(mode) {
  if (meteors.length >= MAX_METEORS) return;
  const sc = screenScale();
  let ang, sp, trailT, w, fireball, life = 0;
  if (mode === 'burst' && wishBurst) {
    // 许愿流星雨：方向沿用环境流星 → 全屏平行；穿越点取在愿望高度 → 流星从你的愿望倾泻
    ang = ambient.ang + rand(-0.10, 0.10);
    sp = rand(620, 1080) * sc;
    trailT = rand(0.42, 0.78);
    w = rand(0.6, 1.3) * 1.35;              // 许愿流星更粗，一眼能看到
    fireball = Math.random() < 0.05;
    mode = 'burst';
  } else if (mode === 'summon' && summon) {
    // 长按召唤：从指尖出发，方向沿用环境流星
    ang = ambient.ang + rand(-0.10, 0.10);
    sp = rand(620, 1080) * sc;
    trailT = rand(0.42, 0.78);
    w = rand(0.7, 1.45);
    fireball = Math.random() < 0.05;
  } else if (mode === 'storm' && storm) {
    // 超级流星暴：全天开花，方向各异，火流星率高
    ang = rand(0, TAU);
    sp = rand(620, 1100) * sc;
    trailT = rand(0.36, 0.75);
    w = rand(0.55, 1.2);
    fireball = Math.random() < 0.11;
  } else {
    // 环境流星：时段内近似平行（真实流星雨照片观感）
    const now = performance.now();
    if (now - ambient.since > rand(50000, 95000)) {
      ambient.since = now;
      ambient.ang = Math.PI - rand(0.30, 0.72);
    }
    ang = ambient.ang + rand(-0.05, 0.05);
    sp = rand(620, 1080) * sc;
    trailT = rand(0.42, 0.78);
    w = rand(0.6, 1.3);
    fireball = Math.random() < 0.02;
  }
  if (fireball) { sp *= rand(0.55, 0.78); trailT *= rand(1.25, 1.8); w *= rand(1.7, 2.6); }

  const dirx = Math.cos(ang), diry = Math.sin(ang);
  const span = Math.max(W, H);
  const margin = 90;
  // px/py 是屏幕坐标，转成世界坐标（相机偏移）后才能与流星坐标运算
  let px, py;
  if (mode === 'burst') {
    px = W * rand(0.02, 0.95) + cam.x;
    py = clamp(wishBurst.y + rand(-30, 60), H * 0.06, H * 0.86) + cam.y;
  } else if (mode === 'summon') {
    px = summon.x + cam.x;
    py = summon.y + cam.y;
  } else if (mode === 'storm') {
    px = W * rand(0.05, 0.95) + cam.x;
    py = H * rand(0.05, 0.9) + cam.y;
  } else {
    px = W * rand(0.04, 0.96) + cam.x;
    py = H * rand(0.02, 0.80) + cam.y;
  }
  // 精确计算：沿反方向退到屏幕外起飞，飞行 life 后从另一侧离屏
  // （用"屏内点反推固定距离"会让大量流星一出生就在屏外被立即删除）
  let tOut = 0;
  const wx1 = px - cam.x, wy1 = py - cam.y;   // 回到屏幕坐标算进出屏距离
  // 起点：沿反方向退到屏幕外（与终点出口相反的边）
  if (dirx > 0) tOut = Math.max(tOut, wx1 + margin);            // 将从左侧外进入
  else if (dirx < 0) tOut = Math.max(tOut, W - wx1 + margin);   // 将从右侧外进入
  if (diry > 0) tOut = Math.max(tOut, wy1 + margin);            // 将从顶部外进入
  else if (diry < 0) tOut = Math.max(tOut, H - wy1 + margin);   // 将从底部外进入
  const back = tOut + rand(0.05, 0.22) * span;
  const ox = px - dirx * back, oy = py - diry * back;
  let life2 = 0;
  if (dirx > 0) life2 = Math.max(life2, (W + margin - wx1) / dirx);
  else if (dirx < 0) life2 = Math.max(life2, (wx1 + margin) / -dirx);
  if (diry > 0) life2 = Math.max(life2, (H + margin - wy1) / diry);
  else if (diry < 0) life2 = Math.max(life2, (wy1 + margin) / -diry);
  life = life2 / sp + 0.08;
  const len = Math.min(sp * trailT, span * 0.95);

  // 规范 07：按星等分布给亮度 —— 暗流星远多于亮流星
  const mag = Math.pow(Math.random(), 2.6);
  const brightBoost = mode === 'burst' ? 0.95 : 1;
  meteors.push({
    ox, oy, x: ox, y: oy, vx: dirx * sp, vy: diry * sp, dirx, diry,
    sp, len, w, fireball, ang,
    // 许愿流星雨若选了类别 → 整场都按类别色；否则走自然光谱
    color: (mode === 'burst' && wishCatTint) ? wishCatTint : pickTint(),
    bright: (0.42 + (1 - mag) * 0.80) * brightBoost,
    t: 0, life, alpha: 0,
    flick: rand(0, TAU), flickRate: rand(9, 16),
    drag: rand(0.04, 0.11),
    flash: 0,
    burst: Math.random() < (fireball ? 0.55 : 0.16) ? rand(0.2, 0.7) : -1,
  });
  const m0 = meteors[meteors.length - 1];
  // 偶发双流星：真实长曝光里常见的 paired meteor，视觉惊喜
  if (Math.random() < 0.045 && meteors.length < MAX_METEORS - 1) {
    const off = rand(10, 26);
    const nx2 = -diry, ny2 = dirx;
    const twin = Object.assign({}, m0);
    twin.ox = m0.ox + nx2 * off; twin.oy = m0.oy + ny2 * off;
    twin.x = twin.ox; twin.y = twin.oy;
    twin.w = m0.w * rand(0.55, 0.8);
    twin.len = m0.len * rand(0.65, 0.9);
    twin.bright = m0.bright * rand(0.55, 0.8);
    twin.sp = m0.sp * rand(0.85, 0.97);
    twin.flick = rand(0, TAU);
    meteors.push(twin);
  }
}

function updateMeteors(dt) {
  // 许愿流星雨：分波调度（含星尘抵达后的爆发波）
  scheduleWishBurst(dt);
  // 长按召唤
  if (summon) {
    summon.t += dt;
    while (summon.spawned < summon.count && summon.t >= summon.spawned * summon.gap) {
      spawnMeteor('summon'); summon.spawned++;
    }
    if (summon.t >= summon.count * summon.gap + 0.5) summon = null;
  }
  // 超级流星暴
  if (storm) {
    storm.t += dt;
    while (storm.spawned < storm.count && storm.t >= storm.spawned * storm.gap) {
      spawnMeteor('storm'); storm.spawned++;
    }
    if (storm.t >= storm.count * storm.gap + 0.8) storm = null;
  }
  if (burstTail > 0) burstTail -= dt;

  meteorTimer -= dt;
  const boost = wishBurst ? 0.16 : (burstTail > 0 ? 0.3 : 1);
  // 大屏按面积补足流星密度，避免桌面端只剩一两条
  const areaK = clamp((W * H) / (390 * 844), 1, 3.2);
  const interval = rand(0.07, 0.26) * boost / areaK;
  if (meteorTimer <= 0) { meteorTimer = interval; spawnMeteor('ambient'); }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.t += dt;
    // 规范 07：大气阻滞减速
    m.vx *= (1 - m.drag * dt); m.vy *= (1 - m.drag * dt);
    m.sp = Math.hypot(m.vx, m.vy);
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.flick += dt * m.flickRate;

    // 规范 07：亮度包络 —— 快速淡入 + 尾段衰减（不是凭空出现/突然消失）
    const p = clamp(m.t / m.life, 0, 1);
    const fadeIn = clamp(m.t / (m.fireball ? 0.18 : 0.09), 0, 1);
    const fadeOut = 1 - Math.pow(clamp((p - 0.68) / 0.32, 0, 1), 1.5);
    m.alpha = fadeIn * fadeOut * m.bright;

    // 规范 07：碎裂闪光
    if (m.burst > 0 && m.t > m.burst && !m.flashed) { m.flashed = true; m.flash = 2.5; }
    if (m.flash > 0) m.flash = Math.max(0, m.flash - dt * 2.2);

    const sx = m.x - cam.x, sy = m.y - cam.y;
    // 离屏余量必须覆盖随机后退距离 + 尾迹长度，否则流星一出生就被清除
    const pad = Math.max(W, H) * 0.85;
    if (m.t >= m.life || sx < -pad || sx > W + pad || sy < -pad || sy > H + pad) {
      if (m.fireball) pushTrain(m);
      meteors.splice(i, 1);
    }
  }
  for (let i = trains.length - 1; i >= 0; i--) {
    trains[i].t += dt;
    if (trains[i].t >= trains[i].dur) trains.splice(i, 1);
  }
}

function pushTrain(m) {
  const traveled = Math.hypot(m.x - m.ox, m.y - m.oy);
  const L = Math.min(m.len, traveled);
  if (L < 40) return;
  const nx = -m.diry, ny = m.dirx;
  trains.push({
    x1: m.x - m.dirx * L, y1: m.y - m.diry * L, x2: m.x, y2: m.y,
    nx, ny, w: m.w * 0.6, t: 0, dur: rand(1.3, 2.6),
    turb: rand(0.7, 1.6), ph: rand(0, TAU),
  });
  if (trains.length > 6) trains.shift();
}

function drawTrains() {
  if (!trains.length) return;
  sctx.save();
  sctx.globalCompositeOperation = 'lighter';
  sctx.lineCap = 'round';
  const N = 8;
  for (const tr of trains) {
    const k = tr.t / tr.dur;
    const a = Math.pow(1 - k, 2.2) * 0.22;
    if (a <= 0.004) continue;

        sg.addColorStop(1, rgbaOf(m.color.core, 0));

      sctx.strokeStyle = '#ffffff';
      sctx.lineWidth = 0.7;
      sctx.beginPath();
      sctx.moveTo(sx - gr * 1.7, sy); sctx.lineTo(sx + gr * 1.7, sy);
      sctx.moveTo(sx, sy - gr * 1.7); sctx.lineTo(sx, sy + gr * 1.7);
      sctx.stroke();
      sctx.globalAlpha = 1;
    }

    }
  }
  sctx.restore();
}

/* ---------- 愿望星图：多个愿望连成图案 ---------- */
const LS_NODE = 'meteor_wish_nodes_v1';
let wishNodes = [];
try { wishNodes = JSON.parse(localStorage.getItem(LS_NODE) || '[]'); } catch (e) { wishNodes = []; }
const MAX_NODES = 8;                   // 与星图槽位一致：许满 8 个都能完整显示
let webBorn = -1;                      // 最新节点接入时间 → 连线生长动画
let webBranches = [];                  // 新节点接入时射出的短枝
let lastRetired = false;               // 本次许愿是否顶掉了最早的星

function pickWishSpot(ts) {
  return wishSpotFor(ts == null ? Date.now() : ts);
}
function saveNodes() {
  try { localStorage.setItem(LS_NODE, JSON.stringify(wishNodes.slice(-MAX_NODES))); } catch (e) {}
}
/* ---------- 星座成形：第 4 个愿望起，星图闭合成环并获得名字 ---------- */
const CONST_NAMES = ['霜染', '听雨', '拾光', '眠云', '旅星', '未央', '织梦', '衔灯', '观澜', '映山', '迟星', '南屿', '落霞', '澄清'];
let closedConstellation = false;
function maybeConstellate() {
  const n = wishNodes.length;
  if (n < 4) return;
  const first = wishNodes[0], last = wishNodes[n - 1];
  const named = wishNodes.find(p => p.constName);
  closedConstellation = true;
  if (named) { last.constName = named.constName; saveNodes(); return; }
  // 仅用连线闭合，绝不移动文字和节点；第五个起沿用同一个星座名字。
  last.constName = CONST_NAMES[irand(0, CONST_NAMES.length - 1)] + '座 · 编号 ' + irand(10, 99);
  closedConstellation = true;
  webBranches.push({ x: last.x, y: last.y, ang: rand(0, TAU), len: 70, t: 0, dur: 1.4 });
  webBranches.push({ x: last.x, y: last.y, ang: rand(0, TAU), len: 56, t: 0, dur: 1.2 });
  glows.push({ x: (first.x + last.x) / 2, y: (first.y + last.y) / 2, t: 0, dur: 1.2, r: 210 });
  flashes.push({ a: 0.1, t: 0, dur: 0.5 });
  saveNodes();
  toast('✦ 星座成形：' + last.constName);
  SFX.chime();
}
function pushWishNode(x, y, text, live, ts, cat) {
  const node = { x, y, text, ts: ts == null ? Date.now() : ts };
  if (cat) node.cat = cat;                 // 类别色随节点走 → 重排/刷新后依然保留
  wishNodes.push(node);
  lastRetired = false;
  while (wishNodes.length > MAX_NODES) { wishNodes.shift(); lastRetired = true; }
  layoutWishNodes();
  if (live) {
    webBorn = performance.now();
    // 新节点接入：向四周射出 2–3 条短枝，长出一瞬再隐去
    for (let i = 0, n = irand(2, 3); i < n; i++) {
      webBranches.push({ x, y, ang: rand(0, TAU), len: rand(24, 58), t: 0, dur: rand(0.85, 1.3) });
    }
  }
  saveNodes();
  return node;
}
/* Catmull-Rom 平滑：让穿过愿望点的线是流动的弧，而不是生硬折线 */
function webPath(pts) {
  if (pts.length < 3) return pts.slice();
  const out = [];
  const P = [pts[0], ...pts, pts[pts.length - 1]];
  for (let i = 0; i < P.length - 3; i++) {
    const p0 = P[i], p1 = P[i + 1], p2 = P[i + 2], p3 = P[i + 3];
    for (let j = 0; j < 8; j++) {
      const t = j / 8, t2 = t * t, t3 = t2 * t;
      out.push({
        x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
      });
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function drawWishWeb(t, dt) {
  if (wishNodes.length < 2 && !webBranches.length) return;
  fctx.save();
  fctx.globalCompositeOperation = 'lighter';
  // 短枝：新节点接入瞬间的生长光线
  for (let i = webBranches.length - 1; i >= 0; i--) {
    const b = webBranches[i];
    b.t += dt;
    const k = b.t / b.dur;
    if (k >= 1) { webBranches.splice(i, 1); continue; }
    const grow = k < 0.45 ? 1 - Math.pow(1 - k / 0.45, 2.4) : 1;
    const a = k < 0.45 ? 1 : Math.pow(1 - (k - 0.45) / 0.55, 1.4);
    const ex = b.x + Math.cos(b.ang) * b.len * grow;
    const ey = b.y + Math.sin(b.ang) * b.len * grow;
    fctx.strokeStyle = 'rgba(214,232,255,' + (0.55 * a).toFixed(3) + ')';
    fctx.lineWidth = 0.9;
    fctx.beginPath();
    fctx.moveTo(b.x, b.y);
    fctx.lineTo(ex, ey);
    fctx.stroke();
    fctx.fillStyle = 'rgba(255,255,255,' + (0.7 * a).toFixed(3) + ')';
    fctx.beginPath();
    fctx.arc(ex, ey, 1.2, 0, TAU);
    fctx.fill();
  }
  if (wishNodes.length < 2) { fctx.restore(); return; }
  // 星座成形：闭合成环
  const closed = closedConstellation && wishNodes.length >= 4 && !!wishNodes[wishNodes.length - 1].constName;
  const ordered = constellationPathNodes();
  const path = webPath(closed ? [...ordered, ordered[0]] : ordered);
  // 闭合时内部填一层极淡的辉光 → "图案"成形
  if (closed && path.length > 3) {
    fctx.fillStyle = 'rgba(178,206,255,.035)';
    fctx.beginPath();
    fctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) fctx.lineTo(path[i].x, path[i].y);
    fctx.closePath();
    fctx.fill();
  }
  // 生长动画：新愿望接入时，光线从旧端"长"到新节点
  let prog = 1;
  if (webBorn > 0) {
    const age = (performance.now() - webBorn) / 900;
    if (age >= 1) webBorn = -1;
    else prog = 1 - Math.pow(1 - clamp(age, 0, 1), 3);
  }
  const N = Math.max(0, Math.floor(path.length * prog));
  if (N >= 2) {
    // 主线：极淡的底光
    fctx.strokeStyle = 'rgba(178,206,255,.15)';
    fctx.lineWidth = 1;
    fctx.beginPath();
    fctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < N; i++) fctx.lineTo(path[i].x, path[i].y);
    fctx.stroke();
    // 微光沿线流动：亮度按"到起点的距离"做正弦 → 能量在输送的观感
    let acc = 0;
    fctx.lineWidth = 1.3;
    for (let i = 1; i < N; i++) {
      acc += Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
      const a = 0.10 + 0.30 * Math.max(0, Math.sin(acc * 0.045 - t * 2.2));
      fctx.strokeStyle = 'rgba(214,232,255,' + a.toFixed(3) + ')';
      fctx.beginPath();
      fctx.moveTo(path[i - 1].x, path[i - 1].y);
      fctx.lineTo(path[i].x, path[i].y);
      fctx.stroke();
    }
    // 两个沿路径奔跑的光脉冲
    for (let k = 0; k < 2; k++) {
      const u = ((t * 0.11 + k * 0.5) % 1) * prog;
      const p = path[Math.min(N - 1, Math.floor(u * (N - 1)))];
      const g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 9);
      g.addColorStop(0, 'rgba(255,255,255,.75)');
      g.addColorStop(0.4, 'rgba(200,222,255,.25)');
      g.addColorStop(1, 'rgba(200,222,255,0)');
      fctx.fillStyle = g;
      fctx.beginPath();
      fctx.arc(p.x, p.y, 9, 0, TAU);
      fctx.fill();
    }
  }
  // 节点：呼吸亮点；最新接入的节点有一次放大脉冲
  // 有类别的愿望按自己的类别色发光 → 星图一眼能看出「哪些心愿属于同一类」
  for (let i = 0; i < wishNodes.length; i++) {
    const n = wishNodes[i];
    const age = (Date.now() - (n.ts || 0)) / 1200;
    const pop = age < 1 ? 1 + (1 - age) * 2.2 : 1;
    const tw = 0.72 + 0.28 * Math.sin(t * 2.4 + i * 1.7);
    const ct = catTint(n);
    fctx.fillStyle = 'rgba(255,255,255,' + (0.85 * tw).toFixed(3) + ')';
    fctx.beginPath();
    fctx.arc(n.x, n.y, 2.0 * tw * pop, 0, TAU);
    fctx.fill();
    const g = fctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 11 * pop);
    if (ct) {
      g.addColorStop(0, 'rgba(255,255,255,' + (0.5 * tw).toFixed(3) + ')');
      g.addColorStop(0.34, 'rgba(' + ct.glow + ',' + (0.42 * tw).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + ct.glow + ',0)');
    } else {
      g.addColorStop(0, 'rgba(214,232,255,' + (0.30 * tw).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(214,232,255,0)');
    }
    fctx.fillStyle = g;
    fctx.beginPath();
    fctx.arc(n.x, n.y, 11 * pop, 0, TAU);
    fctx.fill();
  }
  fctx.restore();
}

/* ---------- 流星能量：许愿或点住流星积累，攒满触发超级流星暴（只显示进度条，不显示数字） ---------- */
const ENERGY_MAX = 8;
const LS_ENERGY = 'meteor_wish_energy_v2';
let wishEnergy = 0;
try {
  const stored = localStorage.getItem(LS_ENERGY);
  wishEnergy = stored == null ? wishes.length % ENERGY_MAX : clamp(Number(stored) || 0, 0, ENERGY_MAX - 1);
} catch (e) { wishEnergy = wishes.length % ENERGY_MAX; }
const energyEl = document.getElementById('energy');
const energyFill = document.getElementById('efill');
const energyFullTag = document.getElementById('efull');
function renderEnergy() {
  try { localStorage.setItem(LS_ENERGY, String(wishEnergy)); } catch (e) {}
  if (wishEnergy <= 0) { energyEl.hidden = true; return; }
  energyEl.hidden = false;
  const full = wishEnergy >= ENERGY_MAX;
  energyFill.style.width = Math.min(100, (wishEnergy / ENERGY_MAX) * 100) + '%';
  energyFullTag.hidden = !full;
  energyEl.classList.toggle('full', full);
  energyEl.classList.remove('bump');
  void energyEl.offsetWidth;
  energyEl.classList.add('bump');
}
function addEnergy() {
  wishEnergy++;
  renderEnergy();
  if (wishEnergy >= ENERGY_MAX) superStorm();
}
function superStorm() {
  wishEnergy = 0;
  renderEnergy();
  storm = { t: 0, spawned: 0, count: irand(130, 175), gap: rand(0.012, 0.024) };
  burstTail = 6.5;
  flashes.push({ a: 0.13, t: 0, dur: 0.6 });
  rings.push({ x: W / 2, y: H * 0.4, t: 0, dur: 1.2, max: Math.max(W, H) * 0.5, w: 1.5, a: 0.34 });
  SFX.storm();
  if (navigator.vibrate) { try { navigator.vibrate([16, 60, 16, 60, 30]); } catch (e) {} }
  toast('✦ 星愿值满 · 超级流星暴降临！');
}

/* ---------- 背景音乐（首个愿望触发，之后不重启） ---------- */const bgm = document.getElementById('bgm');
const MUSIC_ON_KEY = 'sky_music';
let bgmStarted = false;
let musicWanted = (function () { try { return localStorage.getItem(MUSIC_ON_KEY) !== '0'; } catch (e) { return true; } })();
function startBgm() {
  if (bgmStarted) return;
  bgmStarted = true;
  if (!musicWanted) return;
  try {
    bgm.volume = 0;
    const pr = bgm.play();
    if (pr && pr.catch) pr.catch(() => {});
    // 渐入，避免突然出声
    let v = 0;
    const fade = setInterval(() => {
      v += 0.022;
      if (v >= 0.5) { v = 0.5; clearInterval(fade); }
      try { bgm.volume = v; } catch (e) {}
    }, 45);
  } catch (e) {}
}
function setMusic(on) {
  musicWanted = on;
  try { localStorage.setItem(MUSIC_ON_KEY, on ? '1' : '0'); } catch (e) {}
  if (on) {
    bgmStarted = true;
    try { bgm.volume = 0.5; const pr = bgm.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {}
  } else {
    try { bgm.pause(); } catch (e) {}
  }
}
/* ---------- 星图文案：愿望连成线后，送给观众的一段话 ---------- */
const WISH_POEMS = [
  // 星图圆满（8 个愿望）
  '你的愿望\n星星都听见了\n祝你天天开心\n往后的日子\n会一点点好起来的',
  // 星图成形（4 个）
  '你许下的每一个愿望\n都值得被认真对待\n慢慢来，别着急\n好事正在路上',
  // 星图渐满（6 个）
  '谢谢你\n愿意把心事讲给星星听\n祝你天天开心\n明天也是好天气',
];
let poemTimer = null, poemDoneTimer = null;
function showPoem(text) {
  let el = document.querySelector('.poem');
  if (!el) {
    el = document.createElement('div');
    el.className = 'poem';
    document.body.appendChild(el);
  }
  // 诗句整块落在屏幕中央，压在星图之上 —— 让愿望文字与连线先退到后面去
  wishLayer.classList.add('wl-dim');
  fxc.classList.add('web-dim');

  // 先按「行」分组：整句一起推近（pl 行容器 + pc 逐字，两级错开）
  el.classList.remove('show', 'done');
  el.innerHTML = '';
  const frag = document.createDocumentFragment();
  let k = 0;
  for (const line of text.split('\n')) {
    const lineEl = document.createElement('span');
    lineEl.className = 'pl';
    lineEl.style.setProperty('--d', (k * 0.045).toFixed(3) + 's');   // 行与行错开
    const base = k;
    [...line].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'pc';
      s.textContent = ch;
      s.style.setProperty('--td', (base * 0.045 + 0.16 + i * 0.038).toFixed(3) + 's');  // 字与字错开
      lineEl.appendChild(s);
      k++;
    });
    frag.appendChild(lineEl);
  }
  el.appendChild(frag);
  void el.offsetWidth;                       // 强制回流，保证从初始态开始过渡
  el.classList.add('show');

  clearTimeout(poemTimer); clearTimeout(poemDoneTimer);
  // 收尾后撤掉滤镜与过渡层：长驻期间不再占用 GPU
  poemDoneTimer = setTimeout(() => el.classList.add('done'), 180 + k * 42 + 1500);
  poemTimer = setTimeout(() => {
    el.classList.remove('show');
    wishLayer.classList.remove('wl-dim');    // 愿望文字与连线淡回来
    fxc.classList.remove('web-dim');
  }, 7800);
}

/* ---------- 提交动效：输入框里的文字"飞"向夜空 ---------- */
function flyTextToSky(txt, ix, iy, tx, ty) {
  const el = document.createElement('div');
  el.textContent = txt;
  el.style.cssText =
    'position:fixed;z-index:12;pointer-events:none;white-space:nowrap' +
    ';left:' + ix + 'px;top:' + iy + 'px;transform:translate(-50%,-50%)' +
    ';color:#fff;font-size:15px;letter-spacing:.02em' +
    ';text-shadow:0 0 16px rgba(255,255,255,.6),0 0 40px rgba(190,220,255,.4)';
  document.body.appendChild(el);
  const dx = tx - ix, dy = ty - iy;
  el.animate([
    { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
    { transform: 'translate(-50%,-50%) translate(' + (dx * 0.16) + 'px,' + (dy * 0.16 - 24) + 'px) scale(1.1)', opacity: 1, offset: 0.28 },
    { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) scale(1.45)', opacity: 0.12 },
  ], { duration: 950, easing: 'cubic-bezier(.32,.66,.28,1)', fill: 'forwards' });
  setTimeout(() => el.remove(), 1000);
}

/* ---------- 许愿星尘：从输入框飞向天空 ---------- */
let starDust = [];      // 飞行中的星尘粒子（带拖尾）
let wishKeep = [];      // 愿望文字的"星尘环绕"
let wishOutline = [];   // 星尘抵达后拼出的文字轮廓点

/* 把愿望文字采样成粒子目标点：星尘抵达后直接"写"出你的愿望 */
function sampleTextPoints(text) {
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const FONT = 'system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    let fs = 42;
    ctx.font = '600 ' + fs + 'px ' + FONT;
    // 自适应字号：保证不超出屏幕宽度的 82%
    while (ctx.measureText(text).width > W * 0.82 && fs > 20) {
      fs -= 2;
      ctx.font = '600 ' + fs + 'px ' + FONT;
    }
    const cw = Math.ceil(ctx.measureText(text).width) + 8;
    const ch = Math.ceil(fs * 1.5);
    c.width = cw; c.height = ch;
    ctx.font = '600 ' + fs + 'px ' + FONT;   // resize 后需重设
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(text, 4, ch / 2);
    const img = ctx.getImageData(0, 0, cw, ch).data;
    const pts = [];
    const step = 4;
    for (let y = 0; y < ch; y += step) {
      for (let x = 0; x < cw; x += step) {
        if (img[(y * cw + x) * 4 + 3] > 110) pts.push([x - cw / 2, y - ch / 2]);
      }
    }
    // 中点集太大时抽稀，太小则加密采样
    if (pts.length > 150) return pts.filter((_, i) => i % Math.ceil(pts.length / 150) === 0);
    return pts;
  } catch (e) { return []; }
}

function launchStarDust(bx, by, tx, ty, count, textPts) {
  // 粒子数跟随文字采样点：文字有几个点就发几颗，轮廓才完整；无文字点时退回 count
  const n = Math.min(120, textPts.length ? Math.max(count, textPts.length) : count);
  for (let i = 0; i < n; i++) {
    // 目标点：优先落在文字笔画上（星尘抵达后拼成你的愿望），多余粒子做光雾
    let tX, tY;
    if (textPts.length && i < textPts.length) {
      tX = tx + textPts[i][0];
      tY = ty + textPts[i][1];
    } else if (textPts.length) {
      const p = textPts[i % textPts.length];
      tX = tx + p[0] + rand(-7, 7);
      tY = ty + p[1] + rand(-7, 7);
    } else {
      tX = tx + rand(-30, 30);
      tY = ty + rand(-18, 18);
    }
    // 控制点：中段抬高并向侧向偏移 → 每颗走不同的弧线，汇成一束
    const cx = (bx + tX) / 2 + rand(-70, 70);
    const cy = (by + tY) / 2 - rand(60, 190);
    starDust.push({
      x: bx, y: by, sx: bx, sy: by,
      cx, cy, tx: tX, ty: tY,
      t: 0, dur: rand(0.72, 0.92) + i * 0.004,   // 按顺序依次抵达 → 轮廓被"逐笔写出"
      r: rand(0.9, 2.1),
      ph: rand(0, TAU), spin: rand(2, 5),
      hist: [],
      lit: textPts.length > 0,                    // 有文字目标时点亮轮廓
    });
  }
}
function updateStarDust(dt) {
  for (let i = starDust.length - 1; i >= 0; i--) {
    const d = starDust[i];
    d.t += dt;
    const k = clamp(d.t / d.dur, 0, 1);
    const e = 1 - Math.pow(1 - k, 2.4);          // 先快后慢的汇入感
    const u = 1 - e;
    d.x = u * u * d.sx + 2 * u * e * d.cx + e * e * d.tx;
    d.y = u * u * d.sy + 2 * u * e * d.cy + e * e * d.ty;
    d.ph += dt * d.spin;
    d.hist.push(d.x, d.y);
    if (d.hist.length > 24) d.hist.splice(0, 2);
    if (k >= 1) {
      // 抵达：点亮为轮廓点（之后随文字一起亮起、再缓缓熄灭）
      if (d.lit) {
        wishOutline.push({ x: d.tx, y: d.ty, t: 0, dur: 1.55, r: d.r, ph: rand(0, TAU) });
      } else {
        glows.push({ x: d.tx, y: d.ty, t: 0, dur: 0.4, r: 70 });
      }
      starDust.splice(i, 1);
    }
  }
  // 轮廓点生命周期
  for (let i = wishOutline.length - 1; i >= 0; i--) {
    wishOutline[i].t += dt;
    if (wishOutline[i].t >= wishOutline[i].dur) wishOutline.splice(i, 1);
  }
}
function drawStarDust() {
  if (!starDust.length) return;
  fctx.save();
  fctx.globalCompositeOperation = 'lighter';
  for (const d of starDust) {
    const k = clamp(d.t / d.dur, 0, 1);
    const a = 0.35 + 0.65 * Math.sin(k * Math.PI);
    // 拖尾
    const h = d.hist;
    if (h.length >= 4) {
      for (let i = 0; i < h.length - 2; i += 2) {
        const p = i / h.length;
        fctx.fillStyle = 'rgba(226,238,255,' + (a * 0.30 * p).toFixed(3) + ')';
        fctx.beginPath();
        fctx.arc(h[i], h[i + 1], d.r * p * 1.6, 0, TAU);
        fctx.fill();
      }
    }
    // 本体：亮点 + 紧致光晕
    const r = d.r * (1 + 0.25 * Math.sin(d.ph));
    const g = fctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, r * 4);
    g.addColorStop(0, 'rgba(255,255,255,' + (a * 0.95).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(205,224,255,' + (a * 0.30).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(205,224,255,0)');
    fctx.fillStyle = g;
    fctx.beginPath();
    fctx.arc(d.x, d.y, r * 4, 0, TAU);
    fctx.fill();
  }
  fctx.restore();
}
/* 星尘拼出的文字轮廓：抵达后亮起，与 DOM 文字共存片刻再熄灭 */
function drawWishOutline() {
  if (!wishOutline.length) return;
  fctx.save();
  fctx.globalCompositeOperation = 'lighter';
  for (const p of wishOutline) {
    const k = p.t / p.dur;
    // 快亮慢灭：0→0.18 亮起，之后缓落，与 DOM 文字的弹入衔接
    const a = (k < 0.18 ? k / 0.18 : Math.pow(1 - (k - 0.18) / 0.82, 1.6)) * 0.95;
    const tw = 0.7 + 0.3 * Math.sin(p.t * 5 + p.ph);
    const r = p.r * tw;
    const g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3.2);
    g.addColorStop(0, 'rgba(255,255,255,' + (a * 0.9).toFixed(3) + ')');
    g.addColorStop(0.4, 'rgba(214,232,255,' + (a * 0.35).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(214,232,255,0)');
    fctx.fillStyle = g;
    fctx.beginPath();
    fctx.arc(p.x, p.y, r * 3.2, 0, TAU);
    fctx.fill();
  }
  fctx.restore();
}
/* 愿望文字的星尘环绕：文字周围持续有小光点绕行 */
function drawWishKeep(dt) {
  for (let i = wishKeep.length - 1; i >= 0; i--) {
    const k = wishKeep[i];
    k.t += dt;
    if (k.t >= k.dur) { wishKeep.splice(i, 1); continue; }
    const life = k.dur === Infinity
      ? clamp(k.t / 0.8, 0, 1)
      : clamp(k.t / 0.8, 0, 1) * (1 - clamp((k.t - k.dur * 0.75) / (k.dur * 0.25), 0, 1));
    fctx.save();
    fctx.globalCompositeOperation = 'lighter';
    for (let j = 0; j < 7; j++) {
      const ang = k.ph + k.t * (0.5 + j * 0.08) + j * (TAU / 7);
      const rr = 34 + Math.sin(k.t * 0.9 + j) * 8;
      const px = k.x + Math.cos(ang) * rr, py = k.y + Math.sin(ang) * 9;
      const a = life * (0.35 + 0.3 * Math.sin(k.t * 3 + j * 2));
      fctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, a).toFixed(3) + ')';
      fctx.beginPath();
      fctx.arc(px, py, 1.1, 0, TAU);
      fctx.fill();
    }
    fctx.restore();
  }
}

function startWishBurst(bx, by, tx, ty, textPts) {
  // ① 星尘从按钮飞向天空 —— 直接拼成你愿望文字的轮廓（逐笔点亮）
  launchStarDust(bx, by, tx, ty, 48, textPts || []);
  // ② 起点即有的爆发反馈：闪光 + 冲击波 + 辉光
  flashes.push({ a: 0.20, t: 0, dur: 0.55 });
  rings.push({ x: bx, y: by, t: 0, dur: 0.85, max: 130, w: 2.2, a: 0.7 });
  glows.push({ x: bx, y: by, t: 0, dur: 0.55, r: 120 });
  // ③ 分两波流星雨：第一波随文字亮起，第二波更密更亮
  wishBurst = { x: tx, y: ty, t: 0, spawned: 0, count: irand(46, 62), gap: rand(0.016, 0.03), w2: 0 };
  wishBurst.wave2 = irand(34, 46);
  wishBurst.dur = 1.62 + wishBurst.count * wishBurst.gap + wishBurst.wave2 * 0.022 + 0.6;
  burstTail = 4.2;
}
// 由 updateMeteors 调用：按时间轴分波放出流星
function scheduleWishBurst(dt) {
  if (!wishBurst) return;
  wishBurst.t += dt;
  const t = wishBurst.t;
  // 第一波：1.62s 起（星尘抵达、文字弹出）
  while (wishBurst.spawned < wishBurst.count && t >= 1.62 + wishBurst.spawned * wishBurst.gap) {
    spawnMeteor('burst');
    wishBurst.spawned++;
  }
  // 第二波：更密、更亮
  const w2 = Math.max(0, Math.min(wishBurst.wave2, Math.floor((t - 2.5) / 0.024)));
  while (wishBurst.w2 < w2) {
    spawnMeteor('burst');
    wishBurst.w2++;
  }
  if (t >= wishBurst.dur) wishBurst = null;
}

let flashes = [];
let rings = [];
let glows = [];
function drawFxLayer(dt) {
  // 全屏闪光
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.t += dt;
    const k = 1 - f.t / f.dur;
    if (k <= 0) { flashes.splice(i, 1); continue; }
    fctx.fillStyle = 'rgba(255,255,255,' + (f.a * k).toFixed(4) + ')';
    fctx.fillRect(0, 0, W, H);
  }
  // 许愿点辉光（逐渐扩散消散）
  for (let i = glows.length - 1; i >= 0; i--) {
    const g = glows[i];
    g.t += dt;
    const k = g.t / g.dur;
    if (k >= 1) { glows.splice(i, 1); continue; }
    const a = Math.pow(1 - k, 1.6);
    const r = (g.r || 120) + k * 260;
    const gg = fctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, r);
    gg.addColorStop(0, 'rgba(255,255,255,' + (0.26 * a).toFixed(4) + ')');
    gg.addColorStop(0.35, 'rgba(205,224,255,' + (0.10 * a).toFixed(4) + ')');
    gg.addColorStop(1, 'rgba(205,224,255,0)');
    fctx.fillStyle = gg;
    fctx.fillRect(g.x - r, g.y - r, r * 2, r * 2);
  }
  // 冲击波环
  for (let i = rings.length - 1; i >= 0; i--) {
    const r0 = rings[i];
    r0.t += dt;
    const k = r0.t / r0.dur;
    if (k >= 1) { rings.splice(i, 1); continue; }
    const e = 1 - Math.pow(1 - k, 3);
    const rad = 8 + (r0.max - 8) * e;
    fctx.globalCompositeOperation = 'lighter';
    fctx.strokeStyle = 'rgba(226,238,255,' + (r0.a * (1 - k) * (1 - k)).toFixed(4) + ')';
    fctx.lineWidth = Math.max(0.4, r0.w * (1 - k));
    fctx.beginPath();
    fctx.arc(r0.x, r0.y, rad, 0, TAU);
    fctx.stroke();
    fctx.globalCompositeOperation = 'source-over';
  }
  // 许愿星尘 + 愿望环绕 + 文字轮廓 + 愿望星图
  updateStarDust(dt);
  drawStarDust();
  drawWishOutline();
  drawWishKeep(dt);
  drawWishWeb(performance.now() / 1000, dt);
}

/* ---------- 轻量音效（WebAudio 实时合成，无外部文件） ---------- */
const SFX = {
  on: (function () { try { return localStorage.getItem('sky_sfx') !== '0'; } catch (e) { return true; } })(),
  ctx: null,
  ensure() {
    if (!this.on) return null;
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; return null; }
    }
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    return this.ctx;
  },
  setOn(v) {
    this.on = v;
    try { localStorage.setItem('sky_sfx', v ? '1' : '0'); } catch (e) {}
    if (v) this.ensure();
  },
  // 星尘升空：上扫正弦 + 带通风铃
  whoosh() {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(880, t + 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.6);
    const len = 0.5, buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.setValueAtTime(2400, t);
    bp.frequency.exponentialRampToValueAtTime(500, t + 0.5);
    bp.Q.value = 1.2;
    const g2 = c.createGain();
    g2.gain.setValueAtTime(0.03, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    src.connect(bp); bp.connect(g2); g2.connect(c.destination);
    src.start(t); src.stop(t + 0.5);
  },
  // 愿望点亮：钟琴琶音
  chime() {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime;
    [659.25, 783.99, 987.77, 1174.66].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const st = t + i * 0.11;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(0.055, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 1.1);
      o.connect(g); g.connect(c.destination);
      o.start(st); o.stop(st + 1.2);
    });
  },
  // 点住流星：清脆两声
  ping() {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime;
    [1318.5, 1760].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const st = t + i * 0.05;
      g.gain.setValueAtTime(0.05, st);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.5);
      o.connect(g); g.connect(c.destination);
      o.start(st); o.stop(st + 0.55);
    });
  },
  // 超级流星暴：低频轰鸣 + 宽幅气流
  storm() {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(72, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 1.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.10, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 1.9);
    const len = 1.8, buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(160, t + 1.8);
    const g2 = c.createGain();
    g2.gain.setValueAtTime(0.06, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    src.connect(f); f.connect(g2); g2.connect(c.destination);
    src.start(t); src.stop(t + 1.8);
  }
};

/* ---------- 保存星图为 PNG（先预览，再保存） ---------- */
const CONST_FONT = '"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif';
function buildStarMapCanvas() {
  const scale = 2;
  const out = document.createElement('canvas');
  out.width = W * scale; out.height = H * scale;
  const g = out.getContext('2d');
  const w = out.width, h = out.height;
  // 夜空底色
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#000000');
  bg.addColorStop(0.55, '#02030a');
  bg.addColorStop(1, '#04060f');
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);
  // 星星（当前视野）
  for (const s of stars) {
    const sx = (s.x - cam.x * s.p) * scale, sy = (s.y - cam.y * s.p) * scale;
    g.globalAlpha = Math.min(1, s.a * 1.1);
    g.fillStyle = s.c;
    g.beginPath();
    g.arc(sx, sy, Math.max(0.4, s.r * scale * 0.9), 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;
  // 装饰流星：右上 → 左下，与页面流星同一手法
  const streaks = [
    [0.90, 0.14, 0.62, 0.40, 1.0],
    [0.99, 0.30, 0.68, 0.60, 0.7],
    [0.78, 0.06, 0.58, 0.26, 0.55],
  ];
  g.lineCap = 'round';
  for (const st of streaks) {
    const ax = st[0] * w, ay = st[1] * h, bx = st[2] * w, by = st[3] * h, a = st[4];
    const lg = g.createLinearGradient(ax, ay, bx, by);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(1, 'rgba(255,255,255,' + (0.85 * a).toFixed(3) + ')');
    g.strokeStyle = lg;
    g.lineWidth = 1.6 * scale;
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
    // 流星头部光点
    const hg = g.createRadialGradient(bx, by, 0, bx, by, 7 * scale);
    hg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * a).toFixed(3) + ')');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hg;
    g.beginPath(); g.arc(bx, by, 7 * scale, 0, TAU); g.fill();
  }
  // 星图连线
  if (wishNodes.length >= 2) {
    const closed = closedConstellation && !!wishNodes[wishNodes.length - 1].constName;
    const ordered = constellationPathNodes();
    const pts = webPath(closed ? [...ordered, ordered[0]] : ordered);
    g.strokeStyle = 'rgba(178,206,255,.5)';
    g.lineWidth = 1.2 * scale;
    g.beginPath();
    g.moveTo(pts[0].x * scale, pts[0].y * scale);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x * scale, pts[i].y * scale);
    if (closed) g.closePath();
    g.stroke();
  }
  // 节点：光晕 + 星点（有类别的按类别色发光）
  for (const n of wishNodes) {
    const nx = n.x * scale, ny = n.y * scale;
    const ct = catTint(n);
    const glow = g.createRadialGradient(nx, ny, 0, nx, ny, 11 * scale);
    glow.addColorStop(0, ct ? 'rgba(' + ct.glow + ',.5)' : 'rgba(190,220,255,.38)');
    glow.addColorStop(1, ct ? 'rgba(' + ct.glow + ',0)' : 'rgba(190,220,255,0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(nx, ny, 11 * scale, 0, TAU); g.fill();
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(nx, ny, 2.6 * scale, 0, TAU); g.fill();
  }
  // 愿望文字
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = '500 ' + ((W < 360 ? 13 : 15) * scale) + 'px ' + CONST_FONT;
  for (const n of wishNodes) {
    const lines = []; let line = '';
    for (const ch of n.text) {
      if (g.measureText(line + ch).width > wishLabelWidth() * scale && line) { lines.push(line); line = ''; }
      line += ch;
    }
    if (line) lines.push(line);
    if (lines.length > 3) lines[2] = lines[2].slice(0, -1) + '…';
    const visible = lines.slice(0, 3), lineHeight = 23 * scale;
    // 带类别的愿望用类别色渲染 → 卡片上也能按颜色读出「哪几条是同一类心愿」
    const ct = catTint(n);
    g.fillStyle = ct ? ct.tint : '#ffffff';
    visible.forEach((s, i) => g.fillText(s, n.x * scale, n.y * scale + (i - (visible.length - 1) / 2) * lineHeight));
  }
  // 标题与题记
  g.font = '600 ' + (22 * scale) + 'px ' + CONST_FONT;
  g.fillStyle = '#ffffff';
  g.fillText('流星雨许愿', w / 2, 78 * scale);
  g.font = '400 ' + (11 * scale) + 'px ' + CONST_FONT;
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.fillText(wishNodes.length ? (wishNodes.length + ' 个愿望连成的星图') : '一片还没被点亮的夜空', w / 2, 104 * scale);
  const name = wishNodes.length ? wishNodes[wishNodes.length - 1].constName : null;
  let subY = 126 * scale;
  if (name) {
    g.font = '400 ' + (11 * scale) + 'px ' + CONST_FONT;
    g.fillStyle = 'rgba(255,235,170,.85)';
    g.fillText('✦ ' + name, w / 2, subY);
    subY += 20 * scale;
  }
  // 类别摘要：许过的类别按名字列出来（有类别时才出现）
  const catNames = WISH_CATS.filter(c => wishNodes.some(n => n.cat === c.key)).map(c => c.name);
  if (catNames.length) {
    g.font = '400 ' + (10 * scale) + 'px ' + CONST_FONT;
    g.fillStyle = 'rgba(255,255,255,.42)';
    g.fillText('✦ ' + catNames.join(' · '), w / 2, subY);
  }
  // 日期落款
  const d = new Date();
  const dstr = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  // 底部：许过的类别小图标一排（许过的点亮、未许的暗着），再一行日期落款
  const usedCats = WISH_CATS.filter(c => wishNodes.some(n => n.cat === c.key));
  const footY = h - 62 * scale;          // 徽标中心；下方给日期留足一行
  lastCardFootY = footY;
  if (usedCats.length) {
    const gap = 34 * scale;
    const startX = w / 2 - (WISH_CATS.length - 1) * gap / 2;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    WISH_CATS.forEach((c, i) => {
      const on = usedCats.includes(c);
      const cx = startX + i * gap;
      if (on) {
        const cg = g.createRadialGradient(cx, footY, 0, cx, footY, 12 * scale);
        cg.addColorStop(0, 'rgba(' + c.glow + ',.6)');
        cg.addColorStop(1, 'rgba(' + c.glow + ',0)');
        g.fillStyle = cg;
        g.beginPath(); g.arc(cx, footY, 12 * scale, 0, TAU); g.fill();
      }
      g.font = (13 * scale) + 'px ' + CONST_FONT;
      g.fillStyle = on ? c.tint : 'rgba(255,255,255,.16)';
      g.fillText(c.sym, cx, footY - 2 * scale);
      g.font = (9 * scale) + 'px ' + CONST_FONT;
      g.fillStyle = on ? 'rgba(255,255,255,.6)' : 'rgba(255,255,255,.14)';
      g.fillText(c.name, cx, footY + 15 * scale);
    });
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '400 ' + (10 * scale) + 'px ' + CONST_FONT;
  g.fillStyle = 'rgba(255,255,255,.3)';
  g.fillText(dstr + ' · 星语星愿', w / 2, h - 18 * scale);
  // 暗角，让画面更沉
  const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.42)');
  g.fillStyle = vg;
  g.fillRect(0, 0, w, h);
  return out;
}

/* ============================================================
   主循环
   ============================================================ */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;

  // 相机：惯性 + 自动缓漂
  if (!dragging) {
    autoDrift += dt * 0.06;
    cam.tx += Math.cos(autoDrift * 0.7) * dt * 7;
    cam.ty += Math.sin(autoDrift * 0.9) * dt * 5;
    cam.x += (cam.tx - cam.x) * Math.min(1, dt * 1.6) + cam.vx * dt;
    cam.y += (cam.ty - cam.y) * Math.min(1, dt * 1.6) + cam.vy * dt;
    cam.vx *= 0.92; cam.vy *= 0.92;
    clampCam();
  }

  updateMeteors(dt);
  updateNovas(dt);

  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sctx.clearRect(0, 0, W, H);
  fctx.clearRect(0, 0, W, H);

  drawSky(t);
  drawNovas();
  drawMeteors();
  drawFxLayer(dt);

  requestAnimationFrame(frame);
}

    dailyBanner(dailyWord());      // 流星一出现，寄语同步亮出
  }, 2400);
}
if (document.readyState === 'complete') initDaily();
else window.addEventListener('load', initDaily);
requestAnimationFrame(frame);
</script>
