const drawer = document.getElementById('drawer');
const mask = document.getElementById('mask');
const wishList = document.getElementById('wishList');
const wishCount = document.getElementById('wishCount');
const clearV = document.getElementById('clearV');

function renderWishes() {
  wishCount.textContent = wishes.length + ' 个';
  clearV.textContent = wishes.length + ' 条';
  // 副标题：始终把「一共许了几个愿望」说清楚，再报星图进度
  if (!wishes.length) {
    subline.textContent = '对着流星许下愿望';
  } else if (wishNodes.length && wishNodes[wishNodes.length - 1].constName) {
    const short = wishNodes[wishNodes.length - 1].constName.split(' · ')[0];   // 只留「衔灯座」，省出空间给愿望数
    subline.textContent = '✦ ' + short + ' · ' + wishes.length + ' 个愿望 · 星图 ' + wishNodes.length + '/' + MAX_NODES;
  } else if (wishNodes.length >= 2) {
    subline.textContent = wishes.length + ' 个愿望 · 星图 ' + wishNodes.length + '/' + MAX_NODES;
  } else {
    subline.textContent = wishes.length + ' 个愿望 · 长按夜空可召唤流星';
  }
  if (!wishes.length) {
    wishList.innerHTML = '<div class="empty">还没有愿望，去底部写下第一个吧</div>';
    return;
  }
  wishList.innerHTML =
    '<div class="wish-hint">愿望都记在这里 · 夜空中的星图最多同时亮 ' + MAX_NODES + ' 颗（最近 ' + MAX_NODES + ' 个），更早的愿望会留在本列表中</div>' +    wishes.map(w => {
    const c = catOf(w.cat);
    return '<div class="wish"><span class="st"' + (c ? ' style="color:' + c.tint + ';text-shadow:0 0 10px rgba(' + c.glow + ',.8)"' : '') + '>✦</span><div class="bd">' +
    '<div class="txt">' + w.text.replace(/[<>&]/g, ch => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch])) +
    (c ? ' <span class="pill cat-pill" style="font-size:10px;padding:1px 6px;border-color:rgba(' + c.glow + ',.5);color:' + c.tint + '">' + c.sym + ' ' + c.name + '</span>' : '') +
    (w.bless ? ' <span class="pill" style="font-size:10px;padding:1px 6px">流星祝福</span>' : '') +
    '</div><div class="mt">' + timeAgo(w.ts) + '</div></div></div>';
  }).join('');
}

/* ---------- 保存星图为 PNG（先预览，再保存） ---------- */
const CONST_FONT = '"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif';
function buildStarMapCanvas() {
  const scale = 2;
  const out = document.createElement('canvas');
  out.width = W * scale; out.height = H * scale;
  const g = out.getContext('2d');
  const w = out.width, h = out.height;
  // 夜空底色
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#000000');
  bg.addColorStop(0.55, '#02030a');
  bg.addColorStop(1, '#04060f');
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);
  // 星星（当前视野）
  for (const s of stars) {
    const sx = (s.x - cam.x * s.p) * scale, sy = (s.y - cam.y * s.p) * scale;
    g.globalAlpha = Math.min(1, s.a * 1.1);
    g.fillStyle = s.c;
    g.beginPath();
    g.arc(sx, sy, Math.max(0.4, s.r * scale * 0.9), 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;
  // 装饰流星：右上 → 左下，与页面流星同一手法
  const streaks = [
    [0.90, 0.14, 0.62, 0.40, 1.0],
    [0.99, 0.30, 0.68, 0.60, 0.7],
    [0.78, 0.06, 0.58, 0.26, 0.55],
  ];
  g.lineCap = 'round';
  for (const st of streaks) {
    const ax = st[0] * w, ay = st[1] * h, bx = st[2] * w, by = st[3] * h, a = st[4];
    const lg = g.createLinearGradient(ax, ay, bx, by);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(1, 'rgba(255,255,255,' + (0.85 * a).toFixed(3) + ')');
    g.strokeStyle = lg;
    g.lineWidth = 1.6 * scale;
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
    // 流星头部光点
    const hg = g.createRadialGradient(bx, by, 0, bx, by, 7 * scale);
    hg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * a).toFixed(3) + ')');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hg;
    g.beginPath(); g.arc(bx, by, 7 * scale, 0, TAU); g.fill();
  }
  // 星图连线
  if (wishNodes.length >= 2) {
    const closed = closedConstellation && !!wishNodes[wishNodes.length - 1].constName;
    const ordered = constellationPathNodes();
    const pts = webPath(closed ? [...ordered, ordered[0]] : ordered);
    g.strokeStyle = 'rgba(178,206,255,.5)';
    g.lineWidth = 1.2 * scale;
    g.beginPath();
    g.moveTo(pts[0].x * scale, pts[0].y * scale);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x * scale, pts[i].y * scale);
    if (closed) g.closePath();
    g.stroke();
  }
  // 节点：光晕 + 星点（有类别的按类别色发光）
  for (const n of wishNodes) {
    const nx = n.x * scale, ny = n.y * scale;
    const ct = catTint(n);
    const glow = g.createRadialGradient(nx, ny, 0, nx, ny, 11 * scale);
    glow.addColorStop(0, ct ? 'rgba(' + ct.glow + ',.5)' : 'rgba(190,220,255,.38)');
    glow.addColorStop(1, ct ? 'rgba(' + ct.glow + ',0)' : 'rgba(190,220,255,0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(nx, ny, 11 * scale, 0, TAU); g.fill();
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(nx, ny, 2.6 * scale, 0, TAU); g.fill();
  }
  // 愿望文字
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = '500 ' + ((W < 360 ? 13 : 15) * scale) + 'px ' + CONST_FONT;
  for (const n of wishNodes) {
    const lines = []; let line = '';
    for (const ch of n.text) {
      if (g.measureText(line + ch).width > wishLabelWidth() * scale && line) { lines.push(line); line = ''; }
      line += ch;
    }
    if (line) lines.push(line);
    if (lines.length > 3) lines[2] = lines[2].slice(0, -1) + '…';
    const visible = lines.slice(0, 3), lineHeight = 23 * scale;
    // 带类别的愿望用类别色渲染 → 卡片上也能按颜色读出「哪几条是同一类心愿」
    const ct = catTint(n);
    g.fillStyle = ct ? ct.tint : '#ffffff';
    visible.forEach((s, i) => g.fillText(s, n.x * scale, n.y * scale + (i - (visible.length - 1) / 2) * lineHeight));
  }
  // 标题与题记
  g.font = '600 ' + (22 * scale) + 'px ' + CONST_FONT;
  g.fillStyle = '#ffffff';
  g.fillText('流星雨许愿', w / 2, 78 * scale);
  g.font = '400 ' + (11 * scale) + 'px ' + CONST_FONT;
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.fillText(wishNodes.length ? (wishNodes.length + ' 个愿望连成的星图') : '一片还没被点亮的夜空', w / 2, 104 * scale);
  const name = wishNodes.length ? wishNodes[wishNodes.length - 1].constName : null;
  let subY = 126 * scale;
  if (name) {
    g.font = '400 ' + (11 * scale) + 'px ' + CONST_FONT;
    g.fillStyle = 'rgba(255,235,170,.85)';
    g.fillText('✦ ' + name, w / 2, subY);
    subY += 20 * scale;
  }
  // 类别摘要：许过的类别按名字列出来（有类别时才出现）
  const catNames = WISH_CATS.filter(c => wishNodes.some(n => n.cat === c.key)).map(c => c.name);
  if (catNames.length) {
    g.font = '400 ' + (10 * scale) + 'px ' + CONST_FONT;
    g.fillStyle = 'rgba(255,255,255,.42)';
    g.fillText('✦ ' + catNames.join(' · '), w / 2, subY);
  }
  // 日期落款
  const d = new Date();
  const dstr = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  // 底部：许过的类别小图标一排（许过的点亮、未许的暗着），再一行日期落款
  const usedCats = WISH_CATS.filter(c => wishNodes.some(n => n.cat === c.key));
  const footY = h - 62 * scale;          // 徽标中心；下方给日期留足一行
  lastCardFootY = footY;
  if (usedCats.length) {
    const gap = 34 * scale;
    const startX = w / 2 - (WISH_CATS.length - 1) * gap / 2;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    WISH_CATS.forEach((c, i) => {
      const on = usedCats.includes(c);
      const cx = startX + i * gap;
      if (on) {
        const cg = g.createRadialGradient(cx, footY, 0, cx, footY, 12 * scale);
        cg.addColorStop(0, 'rgba(' + c.glow + ',.6)');
        cg.addColorStop(1, 'rgba(' + c.glow + ',0)');
        g.fillStyle = cg;
        g.beginPath(); g.arc(cx, footY, 12 * scale, 0, TAU); g.fill();
      }
      g.font = (13 * scale) + 'px ' + CONST_FONT;
      g.fillStyle = on ? c.tint : 'rgba(255,255,255,.16)';
      g.fillText(c.sym, cx, footY - 2 * scale);
      g.font = (9 * scale) + 'px ' + CONST_FONT;
      g.fillStyle = on ? 'rgba(255,255,255,.6)' : 'rgba(255,255,255,.14)';
      g.fillText(c.name, cx, footY + 15 * scale);
    });
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '400 ' + (10 * scale) + 'px ' + CONST_FONT;
  g.fillStyle = 'rgba(255,255,255,.3)';
  g.fillText(dstr + ' · 星语星愿', w / 2, h - 18 * scale);
  // 暗角，让画面更沉
  const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.42)');
  g.fillStyle = vg;
  g.fillRect(0, 0, w, h);
  return out;
}
let saveDataUrl = null;
let lastCardFootY = 0;    // 最近一次生成分享卡时，底部类别徽标行的中心 y（供验收脚本定位采样）
function openSavePreview() {
  const cv = buildStarMapCanvas();
  saveDataUrl = cv.toDataURL('image/png');
  document.getElementById('saveImg').src = saveDataUrl;
  document.getElementById('saveHelp').textContent = IS_WECHAT
    ? '微信内请先长按这张图；没有保存菜单时，可点纯图模式截屏。无需换浏览器。'
    : isIOSDevice() ? '长按这张预览图保存；或点按钮打开大图。' : '保存后请在浏览器下载记录中查看 PNG。';
  document.getElementById('saveOk').textContent = IS_WECHAT ? '纯图模式 / 截屏' : '保存图片';
  savemask.classList.add('show');
}
function closeSavePreview() {
  savemask.classList.remove('show', 'image-only');
  saveDataUrl = null;
}
function isIOSDevice() {
  const ua = navigator.userAgent;
  if (/iP(hone|ad|od)/.test(ua)) return true;
  // iPad 桌面级 UA 伪装（ iPadOS 13+ ）
  if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
  return false;
}
const IS_WECHAT = /MicroMessenger/i.test(navigator.userAgent);
const wxmask = document.getElementById('wxmask');
function doSaveStarMap() {
  if (!saveDataUrl) return;
  if (IS_WECHAT) {
    // 不跳转、不下载、不复制链接，保留微信当前会话中已经生成的图片。
    savemask.classList.add('image-only');
    document.getElementById('saveHelp').textContent = '长按图片尝试保存；若无菜单，用手机截屏。点图片外的黑边返回。';
    return;
  }
  const a = document.createElement('a');
  a.href = saveDataUrl;
  if (!isIOSDevice() && 'download' in a) {
    // 安卓/桌面 Chrome、Edge、Firefox：直接下载
    a.download = '我的星图.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('✦ 星图已保存为图片');
  } else {
    // iOS Safari 不支持 download 属性：新标签打开大图，长按即可存到相册
    const w = window.open('', '_blank');
    if (w) {
      w.document.write(
        '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">' +
        '<title>我的星图</title></head>' +
        '<body style="margin:0;background:#000;display:grid;place-items:center;min-height:100vh">' +
        '<img src="' + saveDataUrl + '" style="width:100%;max-width:520px;display:block">' +
        '</body></html>'
      );
      w.document.close();
      toast('大图已打开，长按即可保存');
    } else {
      // 弹窗被拦：预览页里的图同样可以长按保存
      document.getElementById('saveHelp').textContent = '新窗口未打开，请长按当前预览图保存。';
      return;
    }
  }
  closeSavePreview();
}
document.getElementById('wxOk').addEventListener('click', () => wxmask.classList.remove('show'));
document.getElementById('wxCopy').addEventListener('click', async () => {
  const url = location.href;
  let okFlag = false;
  try { await navigator.clipboard.writeText(url); okFlag = true; }
  catch (e) {
    // 兜底：老式 textarea + execCommand（部分 webview 只认这个）
    try {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, url.length);
      okFlag = document.execCommand('copy');
      ta.remove();
    } catch (e2) { okFlag = false; }
  }
  toast(okFlag ? '链接已复制，粘贴到浏览器打开' : '复制失败，请手动复制地址栏链接');
  wxmask.classList.remove('show');
});
wxmask.addEventListener('click', (e) => { if (e.target === wxmask) wxmask.classList.remove('show'); });
const savemask = document.getElementById('savemask');
document.getElementById('saveBtn').addEventListener('click', () => {
  sheet.classList.remove('show');
  openSavePreview();
});
document.getElementById('saveCancel').addEventListener('click', closeSavePreview);
document.getElementById('saveOk').addEventListener('click', doSaveStarMap);
savemask.addEventListener('click', e => {
  if (savemask.classList.contains('image-only') && e.target.id !== 'saveImg' && !e.target.closest('.saveview-f')) {
    savemask.classList.remove('image-only');
  } else if (e.target === savemask) closeSavePreview();
});
document.getElementById('clearBtn').addEventListener('click', () => {
  if (!wishes.length) { toast('愿望清单本来是空的'); return; }
  wishes = [];
  wishNodes = []; saveNodes();          // 星图一并清空
  wishEnergy = 0; renderEnergy();
  closedConstellation = false;
  wishLayer.innerHTML = '';             // 星空中的文字标签同步移除
  wishLayer.classList.remove('wl-dim');
  fxc.classList.remove('web-dim');
  // 诗句若正停在屏幕中央，一并收起并恢复星空全速绘制
  clearTimeout(poemTimer); clearTimeout(poemDoneTimer); poemRun++;
  poemEl.classList.remove('show', 'done');
  poemActive = false;
  wishKeep = [];
  try { localStorage.removeItem(LS_WISH); } catch (e) {}
  renderWishes();
  toast('愿望已清空');
  sheet.classList.remove('show');
});
document.getElementById('resetBtn').addEventListener('click', () => {
  buildStars(); meteors = []; trains = []; wishBurst = null;
  toast('星空已重置');
  sheet.classList.remove('show');
});

/* ============================================================
   主循环
   ============================================================ */
let lastT = performance.now();
// 诗句占据屏幕中央期间 → 星空降频绘制，把主线程让给逐字动画
let poemActive = false;
let poemSkip = false;
function frame(now) {
  const t = now / 1000;
  // 诗句出场与停留期间，星空每两帧才画一次（约 30fps）。此时星空已被压暗到 0.3、
  // 观众的注意力在文字上，肉眼几乎看不出降频；而省下的主线程能让逐字点亮稳定跑满帧。
  // ⚠️ 跳过时绝对不能更新 lastT，否则下一次真正绘制时 dt 会被算小 → 整场动画变慢。
  // ⚠️ 用户主动拖动星空时全速绘制，否则会拖手。
  if (poemActive && !dragging) {
    poemSkip = !poemSkip;
    if (poemSkip) { requestAnimationFrame(frame); return; }
  }
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  // 相机：惯性 + 自动缓漂
  if (!dragging) {
    autoDrift += dt * 0.06;
    cam.tx += Math.cos(autoDrift * 0.7) * dt * 7;
    cam.ty += Math.sin(autoDrift * 0.9) * dt * 5;
    cam.x += (cam.tx - cam.x) * Math.min(1, dt * 1.6) + cam.vx * dt;
    cam.y += (cam.ty - cam.y) * Math.min(1, dt * 1.6) + cam.vy * dt;
    cam.vx *= 0.92; cam.vy *= 0.92;
    clampCam();
  }

  updateMeteors(dt);
  updateNovas(dt);

  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sctx.clearRect(0, 0, W, H);
  fctx.clearRect(0, 0, W, H);

  drawSky(t);
  drawNovas();
  drawMeteors();
  drawFxLayer(dt);

  requestAnimationFrame(frame);
}

wishNodes = wishNodes.filter(n => n && typeof n.text === 'string').slice(-MAX_NODES);
resize();
renderWishes();
renderEnergy();
// 老版坐标也重新适配当前手机尺寸，文字与节点同源。
for (const n of wishNodes) addWishLabel(n.text, n.x, n.y, true, n.ts);
saveNodes();
// 预生成一批流星并错开年龄，打开页面就有流星划过
for (let i = 0; i < 16; i++) {
  spawnMeteor('ambient');
  const m = meteors[meteors.length - 1];
  if (m) { m.t = rand(0, m.life * 0.75); m.x = m.ox + m.vx * m.t; m.y = m.oy + m.vy * m.t; }
}
// 今日流星：当天首次打开才落下一颗，配一句当日寄语；同一天再打开不重复
// 延到 window.load 之后再判定：极少数环境（file:// 下的 WebKit）在脚本顶层 /
// DOMContentLoaded 时读 localStorage 可能还没就绪，会导致当天重复触发。
function initDaily() {
  // 等页面稳住、星星先铺开，再让今日流星登场
  setTimeout(() => {
    if (todaySeen()) return;       // 就绪后再判定；已看过就不发
    markTodaySeen();
    launchDailyMeteor(false);
    dailyBanner(dailyWord());      // 流星一出现，寄语同步亮出
  }, 2400);
}
if (document.readyState === 'complete') initDaily();
else window.addEventListener('load', initDaily);
requestAnimationFrame(frame);
</script>
